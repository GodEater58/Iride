name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log

      - name: Segnala errori di compilazione
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Iride-build${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Iride-apk
          path: Iride-*.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Iride build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: Iride-*.apk
