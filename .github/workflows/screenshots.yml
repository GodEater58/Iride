name: Schermate della guida

# Si avvia a mano o con un commit che contiene [screenshots] nel messaggio.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        run: gradle assembleDebug

      - name: Abilita KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore e schermate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # immagine ATD (Automated Test Device): senza servizi Google, si avvia molto
          # più in fretta; con google_apis 31 l'emulatore superava il tempo di avvio
          api-level: 30
          target: aosp_atd
          channel: canary
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        with:
          name: schermate
          path: docs/screenshots

      - name: Salva le schermate nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Schermate della guida aggiornate" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
